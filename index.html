
<!-- MAGA STORE SİFARİŞ EKRANI -->
<div id="magaCheckout" class="maga-overlay" style="display:none">
  <div class="maga-card">
    <button class="maga-close" onclick="magaClose('magaCheckout')">×</button>
    <h2>MAGA STORE</h2>
    <p class="maga-sub">SİFARİŞ MƏLUMATLARI</p>

    <form id="magaForm">
      <label>Ad</label>
      <input id="magaName" required placeholder="Adınız">

      <label>Soyad</label>
      <input id="magaSurname" required placeholder="Soyadınız">

      <label>Ölkə</label>
      <select id="magaCountry" required>
        <option value="+994">Azərbaycan (+994)</option>
        <option value="+90">Türkiyə (+90)</option>
        <option value="+7">Rusiya (+7)</option>
        <option value="+1">ABŞ / Kanada (+1)</option>
        <option value="+44">Böyük Britaniya (+44)</option>
        <option value="+49">Almaniya (+49)</option>
        <option value="+33">Fransa (+33)</option>
        <option value="+966">Səudiyyə Ərəbistanı (+966)</option>
      </select>

      <label>Telefon nömrəsi</label>
      <input id="magaPhone" type="tel" required
             placeholder="50 123 45 67">

      <label>Gmail / E-mail</label>
      <input id="magaEmail" type="email" required
             placeholder="example@gmail.com">

      <label>Satıcıya notunuz</label>
      <textarea id="magaNote" placeholder="Qeydiniz (istəyə bağlı)"></textarea>

      <div class="maga-total">
        <span>Ümumi məbləğ</span>
        <strong id="magaTotal">0.00 AZN</strong>
      </div>

      <button class="maga-pay" type="submit">ÖDƏMƏYƏ KEÇ</button>
    </form>
  </div>
</div>

<!-- DEMO ÖDƏNİŞ EKRANI -->
<div id="magaPayment" class="maga-overlay" style="display:none">
  <div class="maga-card maga-center">
    <button class="maga-close" onclick="magaClose('magaPayment')">×</button>
    <div style="font-size:42px">🔒</div>
    <h2>ÖDƏNİŞ</h2>
    <p class="maga-sub">MAGA STORE</p>

    <div class="maga-total">
      <span>Sifariş məbləği</span>
      <strong id="magaPayTotal">0.00 AZN</strong>
    </div>

    <div class="maga-demo">
      Ödəniş yerimiz hazırda demo rejimindədir.
      Real ödəniş hələ aktiv deyil.
    </div>

    <button class="maga-pay" onclick="magaClose('magaPayment')">
      GERİ QAYIT
    </button>
  </div>
</div>

<style>
.maga-overlay {
  position:fixed; inset:0; z-index:99999;
  overflow-y:auto; padding:18px;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(8px);
  box-sizing:border-box;
}
.maga-card {
  position:relative;
  box-sizing:border-box;
  width:100%; max-width:440px;
  margin:20px auto;
  padding:25px 21px;
  background:#080d15; color:#fff;
  border:1px solid #12304b;
  border-radius:20px;
  box-shadow:0 0 30px #087cff18;
  font-family:Arial,sans-serif;
}
.maga-card h2 {
  text-align:center; margin:8px 0;
  letter-spacing:2px;
}
.maga-sub {
  text-align:center; color:#36aaff;
  font-size:12px; letter-spacing:2px;
  margin:10px 0 24px;
}
.maga-close {
  position:absolute; right:15px; top:10px;
  border:0; background:none; color:#aab5c4;
  font-size:28px; cursor:pointer;
}
.maga-card label {
  display:block; margin:14px 0 7px;
  color:#bdc9d8; font-size:13px;
}
.maga-card input,
.maga-card select,
.maga-card textarea {
  display:block; width:100%; box-sizing:border-box;
  padding:13px; border-radius:10px;
  border:1px solid #1a2b40;
  background:#03070d; color:white;
  font-size:14px; outline:none;
}
.maga-card input:focus,
.maga-card select:focus,
.maga-card textarea:focus {
  border-color:#168cff;
}
.maga-card textarea {
  min-height:75px; resize:vertical;
}
.maga-total {
  display:flex; justify-content:space-between;
  align-items:center; gap:10px;
  padding:15px; margin:20px 0;
  border-radius:11px; background:#030912;
}
.maga-total strong {color:#35aaff}
.maga-pay {
  width:100%; padding:15px;
  border:0; border-radius:11px;
  color:white; font-size:14px;
  font-weight:bold; cursor:pointer;
  background:linear-gradient(100deg,#087cff,#00baff);
}
.maga-demo {
  padding:17px; margin:18px 0;
  border:1px solid #26384b; border-radius:12px;
  background:#030912; color:#b8c6d7;
  font-size:13px; line-height:1.6; text-align:center;
}
.maga-center {text-align:center}
</style>

<script>
let magaOrderAmount = 0;

function openCheckout(amount) {
  magaOrderAmount = Number(amount) || 0;
  document.getElementById("magaTotal").textContent =
    magaOrderAmount.toFixed(2) + " AZN";
  document.getElementById("magaCheckout").style.display = "block";
  document.body.style.overflow = "hidden";
}

function magaClose(id) {
  document.getElementById(id).style.display = "none";
  const checkoutOpen =
    document.getElementById("magaCheckout").style.display === "block";
  const paymentOpen =
    document.getElementById("magaPayment").style.display === "block";
  if (!checkoutOpen && !paymentOpen) {
    document.body.style.overflow = "";
  }
}

document.getElementById("magaForm").addEventListener("submit", function(e) {
  e.preventDefault();

  document.getElementById("magaPayTotal").textContent =
    magaOrderAmount.toFixed(2) + " AZN";

  document.getElementById("magaCheckout").style.display = "none";
  document.getElementById("magaPayment").style.display = "block";
});
</script>
