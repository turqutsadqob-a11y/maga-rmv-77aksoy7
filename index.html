
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGA STORE</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #030509;
  color: white;
}
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  opacity: .45;
  pointer-events: none;
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    180deg, rgba(0,0,0,.45), rgba(0,0,0,.85)
  );
  pointer-events: none;
}
.content {
  position: relative;
  z-index: 2;
  min-height: 100vh;
}
header {
  padding: 24px 16px;
  text-align: center;
  background: rgba(3,5,9,.8);
  border-bottom: 1px solid #17452b;
}
h1 {
  margin: 0;
  color: #39ff14;
  letter-spacing: 4px;
  text-shadow: 0 0 15px #39ff14;
}
.tagline { color: #ccc; margin-top: 10px; }
main {
  width: min(900px, 92%);
  margin: 28px auto;
}
.card {
  padding: 22px;
  margin-bottom: 18px;
  background: rgba(5,12,9,.88);
  border: 1px solid #245b2c;
  border-radius: 16px;
}
h2 { color: #39ff14; margin-top: 0; }
p { line-height: 1.6; color: #ddd; }
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 13px 20px;
  border-radius: 10px;
  background: #39ff14;
  color: #071006;
  text-decoration: none;
  font-weight: bold;
}
footer {
  padding: 25px;
  text-align: center;
  color: #aaa;
}
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline>
  <source src="maga-bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="content">
  <header>
    <h1>MAGA STORE</h1>
    <div class="tagline">GAMING • STORE • COMMUNITY</div>
  </header>

  <main>
    <section class="card">
      <h2>MAGA STORE-a xoş gəlmisən</h2>
      <p>Gaming videoları, yeniliklər və icma xəbərləri bir yerdə.</p>
      <a class="btn" href="https://t.me/Magatg1">Telegram ilə əlaqə</a>
    </section>

    <section class="card">
      <h2>Video nümayişi</h2>
      <p>Fon videosu görünməsə belə saytın əsas məzmunu işləməlidir.</p>
      <video controls playsinline preload="metadata"
        style="width:100%;border-radius:12px;background:#000">
        <source src="maga-bg.mp4" type="video/mp4">
        Video faylı tapılmadı. GitHub layihəsinə maga-bg.mp4 yüklə.
      </video>
    </section>
  </main>

  <footer>© MAGA STORE</footer>
</div>

</body>
</html>
