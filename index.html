<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGA — Global Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #030509;
  color: #f4f7ff;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #172334;
  background: #080d15;
}

.logo {
  color: #20cfff;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 4px;
}

.subtitle {
  color: #8293a8;
  font-size: 12px;
  margin-top: 7px;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: #080d15;
  border: 1px solid #19283a;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  font-size: 15px;
}

input {
  background: #03070d;
  color: white;
  border: 1px solid #24364b;
  outline: none;
}

input:focus {
  border-color: #20cfff;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: #13bde9;
  color: #001019;
}

.secondary {
  background: #142235;
  color: white;
  border: 1px solid #263d56;
}

.small {
  color: #a9bacb;
  font-size: 13px;
  text-align: center;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

.status {
  font-size: 13px;
  color: #20cfff;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.online {
  color: #39df9b;
  font-size: 12px;
}

.messages {
  height: 350px;
  overflow-y: auto;
  padding: 12px;
  margin: 15px 0;
  border-radius: 12px;
  background: #03070d;
  border: 1px solid #172638;
}

.message {
  padding: 11px;
  margin-bottom: 10px;
  background: #0d1928;
  border: 1px solid #192e43;
  border-radius: 10px;
  overflow-wrap: anywhere;
}

.message .name {
  color: #20cfff;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

.message .time {
  color: #70839a;
  font-size: 10px;
  margin-top: 7px;
}

.message .body {
  white-space: pre-wrap;
  line-height: 1.5;
}

.send-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.send-row input {
  min-width: 0;
  flex: 1;
  margin: 0;
}

.send-row button {
  width: 95px;
  margin: 0;
}

footer {
  text-align: center;
  color: #62738a;
  padding: 20px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">MAGA</div>
  <div class="subtitle">GLOBAL COMMUNITY • CHAT</div>
</header>

<main class="container">

  <section id="authCard" class="card">
    <h2 id="authTitle">MAGA hesabına daxil ol</h2>

    <div id="registerFields" class="hidden">
      <input id="fullName" type="text"
        placeholder="Ad və soyad" maxlength="50">
    </div>

    <input id="email" type="email"
      placeholder="Gmail / E-poçt">

    <input id="password" type="password"
      placeholder="Şifrə (ən azı 6 simvol)" minlength="6">

    <button id="authButton" class="primary">
      Daxil ol
    </button>

    <button id="switchButton" class="secondary">
      Yeni hesab yarat
    </button>

    <p class="small">
      Qeydiyyat e-poçt və şifrə ilə aparılır.
      SMS tələb olunmur.
    </p>

    <div id="authStatus" class="status"></div>
  </section>

  <section id="chatCard" class="card hidden">
    <div class="chat-header">
      <div>
        <h2 style="margin-bottom:6px">Qlobal söhbət</h2>
        <div class="online">● Ümumi söhbət otağı</div>
      </div>
      <button id="logoutButton" class="secondary"
        style="width:auto;margin:0;padding:10px">
        Çıxış
      </button>
    </div>

    <p class="small">
      Buraya göndərilən mesajlar eyni otaqdakı
      digər qeydiyyatdan keçmiş istifadəçilərə görünür.
    </p>

    <div id="messages" class="messages">
      <p class="small">Mesajlar yüklənir...</p>
    </div>

    <form id="sendForm" class="send-row">
      <input id="messageInput" type="text"
        placeholder="Mesajını yaz..."
        maxlength="1000" autocomplete="off" required>

      <button class="primary" type="submit">
        Göndər
      </button>
    </form>

    <div id="chatStatus" class="status"></div>
  </section>

</main>

<footer>
  MAGA © 2026 • Global Chat
</footer>

const firebaseConfig = {
  apiKey: "BURAYA_API_KEY",
  authDomain: "BURAYA_PROJECT_ID.firebaseapp.com",
  projectId: "BURAYA_PROJECT_ID",
  storageBucket: "BURAYA_STORAGE_BUCKET",
  messagingSenderId: "BURAYA_SENDER_ID",
  appId: "BURAYA_APP_ID"
};

// 2. BAĞLANTI
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// 3. ELEMENTLƏR
const authCard = document.getElementById("authCard");
const chatCard = document.getElementById("chatCard");
const authTitle = document.getElementById("authTitle");
const authButton = document.getElementById("authButton");
const switchButton = document.getElementById("switchButton");
const registerFields = document.getElementById("registerFields");
const fullName = document.getElementById("fullName");
const email = document.getElementById("email");
const password = document.getElementById("password");
const authStatus = document.getElementById("authStatus");
const chatStatus = document.getElementById("chatStatus");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendForm = document.getElementById("sendForm");
const logoutButton = document.getElementById("logoutButton");

let isRegister = false;
let unsubscribeMessages = null;

// 4. QEYDİYYAT / GİRİŞ DÜYMƏSİ
switchButton.addEventListener("click", () => {
  isRegister = !isRegister;

  registerFields.classList.toggle("hidden", !isRegister);

  authTitle.textContent = isRegister
    ? "Yeni MAGA hesabı yarat"
    : "MAGA hesabına daxil ol";

  authButton.textContent = isRegister
    ? "Qeydiyyatdan keç"
    : "Daxil ol";

  switchButton.textContent = isRegister
    ? "Artıq hesabım var"
    : "Yeni hesab yarat";

  authStatus.textContent = "";
});

// 5. HESAB YARATMA VƏ GİRİŞ
authButton.addEventListener("click", async () => {
  const mail = email.value.trim();
  const pass = password.value;
  const name = fullName.value.trim();

  authStatus.textContent = "";

  if (!mail || !pass) {
    authStatus.textContent = "E-poçt və şifrəni daxil et.";
    return;
  }

  if (pass.length < 6) {
    authStatus.textContent = "Şifrə ən azı 6 simvol olmalıdır.";
    return;
  }

  if (isRegister && !name) {
    authStatus.textContent = "Ad və soyadını daxil et.";
    return;
  }

  authButton.disabled = true;

  try {
    if (isRegister) {
      const result = await auth.createUserWithEmailAndPassword(
        mail, pass
      );

      await result.user.updateProfile({
        displayName: name
      });

      authStatus.textContent = "Hesab yaradıldı.";
    } else {
      await auth.signInWithEmailAndPassword(mail, pass);
    }
  } catch (error) {
    authStatus.textContent = firebaseError(error.code);
  } finally {
    authButton.disabled = false;
  }
});

function firebaseError(code) {
  const errors = {
    "auth/email-already-in-use": "Bu e-poçt artıq qeydiyyatdadır.",
    "auth/invalid-email": "E-poçt ünvanı düzgün deyil.",
    "auth/weak-password": "Daha güclü şifrə seç.",
    "auth/user-not-found": "Bu hesab tapılmadı.",
    "auth/wrong-password": "Şifrə yanlışdır.",
    "auth/invalid-credential": "E-poçt və ya şifrə yanlışdır.",
    "auth/too-many-requests": "Çox cəhd edildi. Sonra yenidən yoxla.",
    "auth/network-request-failed": "İnternet bağlantısını yoxla."
  };

  return errors[code] || ("Xəta: " + code);
}
