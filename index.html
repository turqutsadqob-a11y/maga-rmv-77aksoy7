
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #030509;
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 380px;
  padding: 30px 24px;
  background: #080d15;
  border: 1px solid #123e5c;
  border-radius: 20px;
  box-shadow: 0 0 30px #0077ff20;
  text-align: center;
}

.logo {
  color: #16baff;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 5px;
  margin-bottom: 8px;
  text-shadow: 0 0 20px #009dff80;
}

.subtitle {
  color: #8295aa;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 30px;
}

h2 {
  font-size: 20px;
  margin-bottom: 24px;
}

input {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #20384e;
  background: #030810;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #12aaff;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #087bff, #12c5ff);
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  opacity: 0.75;
}

.secondary {
  background: #101b29;
  border: 1px solid #23445f;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 12px;
  border-radius: 9px;
  background: #101b29;
  color: #70d7ff;
  font-size: 14px;
  line-height: 1.5;
}

.footer {
  margin-top: 24px;
  font-size: 11px;
  color: #65788d;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">MAGA</div>
  <div class="subtitle">SECURE CHANNEL</div>

  <section id="loginScreen">
    <h2>Hesaba giriş</h2>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Gmail ünvanın"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Şifrən"
        autocomplete="current-password"
        required
      >

      <button type="submit">LOGIN</button>
    </form>

    <button type="button" class="secondary" id="showRegister">
      QEYDİYYAT
    </button>
  </section>

  <section id="registerScreen" hidden>
    <h2>Yeni hesab</h2>

    <form id="registerForm">
      <input
        id="fullName"
        type="text"
        placeholder="Ad və soyad"
        autocomplete="name"
        required
      >

      <input
        id="regEmail"
        type="email"
        placeholder="Gmail ünvanın"
        autocomplete="email"
        required
      >

      <input
        id="regPassword"
        type="password"
        placeholder="Şifrə yarat"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button type="submit">HESAB YARAT</button>
    </form>

    <button type="button" class="secondary" id="showLogin">
      GİRİŞƏ QAYIT
    </button>
  </section>

  <div id="message" class="message" role="status"></div>

  <div class="footer">MAGA © 2026</div>
</div>

<script>
const loginScreen = document.getElementById("loginScreen");
const registerScreen = document.getElementById("registerScreen");
const message = document.getElementById("message");

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

document.getElementById("showRegister").addEventListener("click", function () {
  loginScreen.hidden = true;
  registerScreen.hidden = false;
  message.style.display = "none";
});

document.getElementById("showLogin").addEventListener("click", function () {
  registerScreen.hidden = true;
  loginScreen.hidden = false;
  message.style.display = "none";
});

document.getElementById("loginForm").addEventListener("submit", function (event) {
  event.preventDefault();

  showMessage(
    "Düymə işləyir. Həqiqi giriş üçün təhlükəsiz hesab sistemi qoşulmalıdır."
  );
});

document.getElementById("registerForm").addEventListener("submit", function (event) {
  event.preventDefault();

  showMessage(
    "Düymə işləyir. Hesab hələ yaradılmayıb: server sistemi qoşulmalıdır."
  );
});
</script>

</body>
</html>
