<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGA TikTok</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#111;padding:16px;text-align:center;z-index:2}
header h2{margin:0;color:#25f4ee}
.add{padding:15px;background:#151515}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#222;color:white}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#25f4ee;color:#000;font-weight:bold}
#feed{max-width:600px;margin:auto;padding:12px}
.video{background:#151515;border-radius:12px;padding:12px;margin-bottom:18px;text-align:center}
.video a{color:#25f4ee;overflow-wrap:anywhere}
.remove{background:#333;color:white}
</style>
</head>
<body>
<header><h2>MAGA TIKTOK</h2><div>Video lenti</div></header>

<div class="add">
<input id="videoUrl" placeholder="TikTok video linkini bura yapışdır">
<button onclick="addVideo()">Videonu əlavə et</button>
</div>

<div id="feed"></div>

<script>
const feed=document.getElementById("feed");
let videos=[];
try{videos=JSON.parse(localStorage.getItem("magaVideos")||"[]")}catch(e){videos=[]}

function render(){
 feed.replaceChildren();
 videos.forEach((url,index)=>{
  const card=document.createElement("div");
  card.className="video";
  const link=document.createElement("a");
  link.href=url;
  link.target="_blank";
  link.rel="noopener";
  link.textContent="TikTok videosunu aç";
  const frame=document.createElement("iframe");
  const match=url.match(/\/video\/(\d+)/);
  if(match){
   frame.src="https://www.tiktok.com/player/v1/"+match[1]+"?description=1&music_info=1";
   frame.width="100%";
   frame.height="580";
   frame.style.border="0";
   frame.allow="fullscreen";
   frame.title="TikTok video";
  }
  const remove=document.createElement("button");
  remove.className="remove";
  remove.textContent="Siyahıdan sil";
  remove.onclick=()=>{
   videos.splice(index,1);
   save();
  };
  card.append(link);
  if(match)card.appendChild(frame);
  card.appendChild(remove);
  feed.appendChild(card);
 });
}
function addVideo(){
 const input=document.getElementById("videoUrl");
 const url=input.value.trim();
 if(!/^https:\/\/(www\.tiktok\.com|vm\.tiktok\.com|vt\.tiktok\.com)\//i.test(url)){
  alert("Düzgün TikTok video linki daxil et.");
  return;
 }
 if(!videos.includes(url))videos.unshift(url);
 save();
 input.value="";
}
function save(){
 try{localStorage.setItem("magaVideos",JSON.stringify(videos))}
 catch(e){alert("Telefon yaddaşında saxlamaq mümkün olmadı.")}
 render();
}
render();
</script>
</body>
</html>
